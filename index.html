<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOA</title>
<style>
:root{
  --bg1:#eaf5ec;--bg2:#d9efe3;--blob1:#a8dcc0;--blob2:#cfeab5;--blob3:#b7e6e0;
  --glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.78);
  --border:rgba(255,255,255,.85);--shadow:0 10px 40px rgba(60,120,90,.12);
  --text:#1f3a2e;--sub:#6b8577;--accent:#5bb38a;--accent2:#86d0a8;--accent-ink:#17402f;
  --top-bg:rgba(176,228,200,.55);
  --urgent-bg:#ffe5d8;--urgent-ink:#b4532a;--calm-bg:#dcf3e5;--calm-ink:#2f7a58;--err:#d9644a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#0c1612;--bg2:#12231b;--blob1:#2f7a58;--blob2:#4d7a2f;--blob3:#1f6b66;
    --glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.12);--shadow:0 10px 40px rgba(0,0,0,.4);
    --text:#e6f4ec;--sub:#8fae9f;--accent:#6cc79b;--accent2:#9ae0bb;--accent-ink:#0c2a1d;
    --top-bg:rgba(108,199,155,.18);
    --urgent-bg:rgba(255,160,120,.18);--urgent-ink:#ffb594;--calm-bg:rgba(108,199,155,.16);--calm-ink:#9ae0bb;--err:#ff8f78;
  }
}
:root[data-theme="dark"]{
  --bg1:#0c1612;--bg2:#12231b;--blob1:#2f7a58;--blob2:#4d7a2f;--blob3:#1f6b66;
  --glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.12);--shadow:0 10px 40px rgba(0,0,0,.4);
  --text:#e6f4ec;--sub:#8fae9f;--accent:#6cc79b;--accent2:#9ae0bb;--accent-ink:#0c2a1d;
  --top-bg:rgba(108,199,155,.18);
  --urgent-bg:rgba(255,160,120,.18);--urgent-ink:#ffb594;--calm-bg:rgba(108,199,155,.16);--calm-ink:#9ae0bb;--err:#ff8f78;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  position:relative;overflow-x:hidden;
}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.7;z-index:0;pointer-events:none}
.b1{width:360px;height:360px;background:var(--blob1);top:-100px;right:-100px}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-80px;left:-80px}
.b3{width:240px;height:240px;background:var(--blob3);top:48%;left:60%}
main{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:44px 18px 56px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{margin:0;font-size:46px;line-height:1;font-weight:800;letter-spacing:-2px}
h1 i{font-style:normal;color:var(--accent)}
.tag{margin:0;color:var(--sub);font-size:13px;text-align:right;line-height:1.5}
.glass{
  background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
  border-radius:28px;
}
form{padding:20px;display:grid;gap:14px}
input[type=text],input[type=date]{
  width:100%;height:50px;padding:0 18px;border-radius:999px;border:1px solid var(--border);
  background:var(--glass-strong);color:var(--text);font:inherit;font-size:15px;outline:none;transition:.15s;
}
input::placeholder{color:var(--sub)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,179,138,.2)}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
.lbl{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 7px 8px;display:block}
.seg{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--border);height:50px}
.seg label{flex:1}
.seg input{display:none}
.seg span{display:grid;place-items:center;height:100%;border-radius:999px;cursor:pointer;font-weight:700;color:var(--sub);transition:.15s}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(91,179,138,.35)}
button.add{
  height:52px;border:0;border-radius:999px;color:var(--accent-ink);font:inherit;font-weight:800;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 20px rgba(91,179,138,.35);transition:.15s;
}
button.add:active{transform:scale(.98)}
.err{min-height:14px;margin:-4px 0 0 8px;font-size:12px;color:var(--err)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 8px 12px}
.head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.5px}.head small{color:var(--sub);font-size:13px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 20px;border-radius:26px;transition:.2s}
li.top{background:var(--top-bg);padding:20px 18px 20px 22px}
li.top .t{font-size:17px}
li.done{opacity:.45}
li.done .t{text-decoration:line-through}
.rank{flex:none;width:34px;font-weight:800;font-size:24px;letter-spacing:-1px;color:var(--accent);font-variant-numeric:tabular-nums}
li.done .rank{font-size:13px;letter-spacing:0;color:var(--sub)}
.info{flex:1;min-width:0}
.now{display:inline-block;margin-bottom:6px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.3px}
.t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--sub)}
.pill{padding:3px 10px;border-radius:999px;font-weight:700;background:var(--calm-bg);color:var(--calm-ink)}
.pill.urgent{background:var(--urgent-bg);color:var(--urgent-ink)}
.chk{width:24px;height:24px;accent-color:var(--accent);cursor:pointer;flex:none}
.del{flex:none;border:0;background:transparent;color:var(--sub);font-size:16px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.del:hover{background:var(--glass-strong)}
.empty{display:block;text-align:center;color:var(--sub);padding:44px 16px}
.note{margin:24px 0 0;text-align:center;font-size:12px;color:var(--sub);line-height:1.6}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <div class="brand">
    <h1>moa<i>.</i></h1>
    <p class="tag">simple & easy<br>schedule manager</p>
  </div>

  <form class="glass" id="f" autocomplete="off">
    <div><label class="lbl" for="title">schedule</label>
      <input type="text" id="title" placeholder="write your schedule" maxlength="60"></div>
    <div class="row">
      <div><label class="lbl" for="due">date</label><input type="date" id="due"></div>
      <div><span class="lbl">importance</span>
        <div class="seg">
          <label><input type="radio" name="imp" value="1"><span>1</span></label>
          <label><input type="radio" name="imp" value="2"><span>2</span></label>
          <label><input type="radio" name="imp" value="3" checked><span>3</span></label>
          <label><input type="radio" name="imp" value="4"><span>4</span></label>
          <label><input type="radio" name="imp" value="5"><span>5</span></label>
        </div></div>
    </div>
    <p class="err" id="err"></p>
    <button class="add" type="submit">add</button>
  </form>

  <div class="head"><h2>list</h2><small id="cnt"></small></div>
  <ul id="list"></ul>
  <p class="note">날짜가 3일 이내로 다가오면 순위가 올라가요<br>일정은 이 기기의 브라우저에 자동 저장돼요</p>
</main>

<script>
const KEY = 'moa.tasks.v1';
const $ = id => document.getElementById(id);
let tasks = load();

function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} }

function todayMidnight(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysLeft(t){
  const [y,m,d] = t.due.split('-').map(Number);
  return Math.round((new Date(y, m-1, d) - todayMidnight()) / 864e5);
}
const score = t => (daysLeft(t) <= 3 ? 5 : 1) + t.importance;
const dday = n => n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n) ;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(){
  const list = $('list'); list.innerHTML = '';
  const sorted = [...tasks].sort((a,b) =>
    (a.done - b.done) || (score(b) - score(a)) || a.due.localeCompare(b.due));
  const active = tasks.filter(t => !t.done).length;
  $('cnt').textContent = tasks.length ? active  : '';

  if (!sorted.length){
    list.appendChild(el('li', 'glass empty', 'no schedule. add your schedule now.'));
    return;
  }
  let rank = 0;
  sorted.forEach(t => {
    if (!t.done) rank++;
    const n = daysLeft(t);
    const li = el('li', 'glass' + (t.done ? ' done' : rank === 1 ? ' top' : ''));
    li.appendChild(el('div', 'rank', t.done ? 'clear' : rank));

    const info = el('div', 'info');
    if (!t.done && rank === 1) info.appendChild(el('span', 'now', 'most important'));
    info.appendChild(el('div', 't', t.title));
    const m = el('div', 'm');
    m.append(el('span', 'pill' + (n <= 3 ? ' urgent' : ''), dday(n)), el('span', '', t.due + ' · importance ' + t.importance));
    info.appendChild(m);
    li.appendChild(info);

    const c = el('input', 'chk'); c.type = 'checkbox'; c.checked = t.done;
    c.onchange = () => { t.done = c.checked; save(); render(); };
    const x = el('button', 'del', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'delete');
    x.onclick = () => { tasks = tasks.filter(k => k.id !== t.id); save(); render(); };
    li.append(c, x);
    list.appendChild(li);
  });
}

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('title').value.trim(), due = $('due').value;
  if (!title) return $('err').textContent = '일정 이름을 입력해 주세요.';
  if (!due) return $('err').textContent = '마감일을 선택해 주세요.';
  const imp = Number(document.querySelector('input[name=imp]:checked').value);
  tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, due, importance: imp, done: false });
  save();
  $('title').value = ''; $('due').value = iso(todayMidnight()); $('err').textContent = '';
  render();
});

$('due').value = iso(todayMidnight());
render();
</script>
</body>
</html>
