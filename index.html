<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOA</title>
<style>
:root{
  --bg1:#dfe6ff;--bg2:#ffe3f1;--blob1:#8b93ff;--blob2:#ff9ccf;--blob3:#7fe3d0;
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.72);
  --border:rgba(255,255,255,.75);--shadow:0 8px 32px rgba(70,70,140,.14);
  --text:#1b1c33;--sub:#6a6e88;--accent:#6366f1;--accent2:#8b5cf6;
  --hot:#f43f5e;--mid:#f59e0b;--low:#94a3b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#0d0f1f;--bg2:#1a1030;--blob1:#4f46e5;--blob2:#be185d;--blob3:#0f766e;
    --glass:rgba(255,255,255,.07);--glass-strong:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.14);--shadow:0 8px 32px rgba(0,0,0,.35);
    --text:#f1f2fa;--sub:#a0a4bd;
  }
}
:root[data-theme="dark"]{
  --bg1:#0d0f1f;--bg2:#1a1030;--blob1:#4f46e5;--blob2:#be185d;--blob3:#0f766e;
  --glass:rgba(255,255,255,.07);--glass-strong:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.14);--shadow:0 8px 32px rgba(0,0,0,.35);
  --text:#f1f2fa;--sub:#a0a4bd;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;
  position:relative;overflow-x:hidden;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:340px;height:340px;background:var(--blob1);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-60px;right:-60px}
.b3{width:220px;height:220px;background:var(--blob3);top:45%;left:55%}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:36px 18px 48px}
h1{margin:0;font-size:34px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:4px 0 22px;color:var(--sub);font-size:14px}
.glass{
  background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border-radius:22px;
}
form{padding:18px;display:grid;gap:12px}
input[type=text],input[type=date]{
  width:100%;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--glass-strong);color:var(--text);font:inherit;font-size:15px;outline:none;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
.row{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
.lbl{font-size:12px;color:var(--sub);margin:0 0 6px 4px;display:block}
.seg{display:flex;gap:6px}
.seg label{flex:1}
.seg input{display:none}
.seg span{
  display:block;text-align:center;height:46px;line-height:44px;border-radius:14px;cursor:pointer;
  border:1px solid var(--border);background:var(--glass-strong);font-weight:600;transition:.15s;
}
.seg input:checked+span{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
button.add{
  height:48px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(99,102,241,.4);transition:.15s;
}
button.add:active{transform:scale(.98)}
.err{min-height:16px;margin:0;font-size:12px;color:var(--hot)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 6px 10px}
.head h2{margin:0;font-size:16px}.head small{color:var(--sub)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px}
li.done{opacity:.5}
li.done .t{text-decoration:line-through}
.score{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.hot{background:var(--hot)}.mid{background:var(--mid)}.low{background:var(--low)}
.info{flex:1;min-width:0}
.t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{font-size:12px;color:var(--sub);margin-top:2px}
.m b{color:var(--text)}
.chk{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;flex:none}
.del{flex:none;border:0;background:transparent;color:var(--sub);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:10px}
.del:hover{background:var(--glass-strong)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.note{margin-top:22px;text-align:center;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <h1>MOA</h1>
  <p class="tag">흩어진 일정을 한곳에 모아요</p>

  <form class="glass" id="f" autocomplete="off">
    <div><label class="lbl" for="title">일정</label>
      <input type="text" id="title" placeholder="무슨 일정인가요?" maxlength="60"></div>
    <div class="row">
      <div><label class="lbl" for="due">마감일</label><input type="date" id="due"></div>
      <div><span class="lbl">중요도</span>
        <div class="seg">
          <label><input type="radio" name="imp" value="1"><span>1</span></label>
          <label><input type="radio" name="imp" value="2"><span>2</span></label>
          <label><input type="radio" name="imp" value="3" checked><span>3</span></label>
          <label><input type="radio" name="imp" value="4"><span>4</span></label>
          <label><input type="radio" name="imp" value="5"><span>5</span></label>
        </div></div>
    </div>
    <p class="err" id="err"></p>
    <button class="add" type="submit">일정 추가</button>
  </form>

  <div class="head"><h2>우선순위</h2><small id="cnt"></small></div>
  <ul id="list"></ul>
  <p class="note">점수 = 마감 임박(D-3 이하 5점, 그 외 1점) + 중요도 · 이 기기의 브라우저에 자동 저장돼요</p>
</main>

<script>
const KEY = 'moa.tasks.v1';
const $ = id => document.getElementById(id);
let tasks = load();

function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} }

function todayMidnight(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysLeft(t){
  const [y,m,d] = t.due.split('-').map(Number);
  return Math.round((new Date(y, m-1, d) - todayMidnight()) / 864e5);
}
const score = t => (daysLeft(t) <= 3 ? 5 : 1) + t.importance;
const dday = n => n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n) + ' 지남';

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(){
  const list = $('list'); list.innerHTML = '';
  const sorted = [...tasks].sort((a,b) =>
    (a.done - b.done) || (score(b) - score(a)) || a.due.localeCompare(b.due));
  $('cnt').textContent = tasks.length ? tasks.filter(t => !t.done).length + '개 남음' : '';

  if (!sorted.length){
    list.appendChild(el('li', 'glass empty', '아직 일정이 없어요. 첫 일정을 추가해 보세요 ✨'));
    return;
  }
  sorted.forEach(t => {
    const s = score(t);
    const li = el('li', 'glass' + (t.done ? ' done' : ''));
    li.appendChild(el('div', 'score ' + (s >= 8 ? 'hot' : s >= 6 ? 'mid' : 'low'), s));

    const info = el('div', 'info');
    info.appendChild(el('div', 't', t.title));
    const m = el('div', 'm');
    const b = el('b', '', dday(daysLeft(t)));
    m.append(b, ' · ' + t.due + ' · 중요도 ' + t.importance);
    info.appendChild(m);
    li.appendChild(info);

    const c = el('input', 'chk'); c.type = 'checkbox'; c.checked = t.done;
    c.onchange = () => { t.done = c.checked; save(); render(); };
    const x = el('button', 'del', '✕'); x.type = 'button'; x.setAttribute('aria-label', '삭제');
    x.onclick = () => { tasks = tasks.filter(k => k.id !== t.id); save(); render(); };
    li.append(c, x);
    list.appendChild(li);
  });
}

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('title').value.trim(), due = $('due').value;
  if (!title) return $('err').textContent = '일정 이름을 입력해 주세요.';
  if (!due) return $('err').textContent = '마감일을 선택해 주세요.';
  const imp = Number(document.querySelector('input[name=imp]:checked').value);
  tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, due, importance: imp, done: false });
  save();
  $('title').value = ''; $('due').value = iso(todayMidnight()); $('err').textContent = '';
  render();
});

$('due').value = iso(todayMidnight());
render();
</script>
</body>
</html>
